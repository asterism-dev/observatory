name: observatory

services:
  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/observatory.sql:ro
  # Loads the kernel modules the gateway needs (OrbStack ships openvswitch unloaded); built-in modules make modprobe fail harmlessly.
  modules:
    image: alpine:3.22
    profiles: [gateway]
    privileged: true
    volumes:
      - /lib/modules:/lib/modules:ro
    command: ["sh", "-c", "modprobe -a openvswitch wireguard || true"]
  gateway:
    build:
      context: ../..
      dockerfile: deploy/gateway.Dockerfile
    profiles: [gateway]
    restart: unless-stopped
    depends_on:
      modules:
        condition: service_completed_successfully
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    sysctls:
      net.ipv4.ip_forward: "1"
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      HUB_URL: ${HUB_URL:-http://host.docker.internal:8090}
      OBSERVATORY_GATEWAY_TOKEN: ${OBSERVATORY_GATEWAY_TOKEN:-}
    ports:
      - "51820:51820/udp"
      - "51821:51821/udp"
    volumes:
      - ovn:/var/lib/ovn
      - ovs:/etc/openvswitch
  # Shares the gateway's network namespace so exports listen on the underlay address only, nothing published on the host.
  storage:
    build:
      context: ../..
      dockerfile: deploy/storage.Dockerfile
    profiles: [gateway]
    restart: unless-stopped
    network_mode: service:gateway
    depends_on: [gateway]
    environment:
      HUB_URL: ${HUB_URL:-http://host.docker.internal:8090}
      OBSERVATORY_STORAGE_TOKEN: ${OBSERVATORY_STORAGE_TOKEN:-}
    volumes:
      - disks:/disks
    tmpfs: [/run/storage]

volumes:
  postgres-data:
  ovn:
  ovs:
  disks:
