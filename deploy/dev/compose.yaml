name: observatory

services:
  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/observatory.sql:ro
  # For a hub on the host (make registry-up); restarts until the hub has written its token certificate.
  registry:
    image: registry:3.0.0@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e
    profiles: [registry]
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      OTEL_TRACES_EXPORTER: none
      REGISTRY_AUTH_TOKEN_REALM: ${OBSERVATORY_PUBLIC_URL:-http://localhost:8090}/v2/token
      REGISTRY_NOTIFICATIONS_ENDPOINTS: |
        - name: hub
          url: ${HUB_URL:-http://host.docker.internal:8090}/internal/registry/events
          headers: {Authorization: ["Bearer ${OBSERVATORY_REGISTRY_EVENTS_SECRET:-}"]}
          timeout: 10s
          threshold: 3
          backoff: 10s
          ignore: {actions: [pull]}
    ports:
      - "127.0.0.1:55000:5000"
    volumes:
      - ../registry/config.yml:/etc/distribution/config.yml:ro
      - registry-data:/var/lib/registry
      - ./registry-certs:/keys:ro
  # For a hub on the host (make telemetry-up).
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.156.0@sha256:da8a90ac0912f16589be2b96a6441a2fca4bca415c83783d972d92e3b5b66970
    profiles: [telemetry]
    restart: unless-stopped
    command: ["-storageDataPath=/storage", "-retentionPeriod=30d", "-opentelemetry.usePrometheusNaming", "-opentelemetry.promoteScopeMetadata=false"]
    ports:
      - "127.0.0.1:58428:8428"
    volumes:
      - metrics-data:/storage
  victorialogs:
    image: victoriametrics/victoria-logs:v1.54.0@sha256:ee4e820cac3721f5f5d91641b950c22439593adc4224f9655e5333d5a84c1dfe
    profiles: [telemetry]
    restart: unless-stopped
    command: ["-storageDataPath=/storage", "-retentionPeriod=14d", "-search.maxQueryDuration=60s"]
    ports:
      - "127.0.0.1:59428:9428"
    volumes:
      - logs-data:/storage
  # Loads the kernel modules the gateway needs (OrbStack ships openvswitch unloaded); built-in modules make modprobe fail harmlessly.
  modules:
    image: alpine:3.22
    profiles: [gateway]
    privileged: true
    volumes:
      - /lib/modules:/lib/modules:ro
    command: ["sh", "-c", "modprobe -a openvswitch wireguard xt_connlimit || true"]
  # Owns the network namespace of gateway and storage, so a gateway crash or kill leaves storage's namespace in place.
  netns:
    image: alpine:3.22
    profiles: [gateway]
    restart: unless-stopped
    init: true
    command: ["sleep", "infinity"]
    sysctls:
      net.ipv4.ip_forward: "1"
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports:
      - "51820:51820/udp"
      - "51821:51821/udp"
  gateway:
    build:
      context: ../..
      dockerfile: deploy/gateway.Dockerfile
    profiles: [gateway]
    restart: unless-stopped
    network_mode: service:netns
    depends_on:
      netns:
        condition: service_started
        restart: true
      modules:
        condition: service_completed_successfully
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    environment:
      HUB_URL: ${HUB_URL:-http://host.docker.internal:8090}
      OBSERVATORY_GATEWAY_TOKEN: ${OBSERVATORY_GATEWAY_TOKEN:-}
    volumes:
      - ovn:/var/lib/ovn
      - ovs:/etc/openvswitch
  # Shares the gateway's network namespace so exports listen on the underlay address only, nothing published on the host.
  storage:
    build:
      context: ../..
      dockerfile: deploy/storage.Dockerfile
    profiles: [gateway]
    restart: unless-stopped
    network_mode: service:netns
    depends_on:
      netns:
        condition: service_started
        restart: true
      gateway:
        condition: service_started
    environment:
      HUB_URL: ${HUB_URL:-http://host.docker.internal:8090}
      OBSERVATORY_STORAGE_TOKEN: ${OBSERVATORY_STORAGE_TOKEN:-}
    volumes:
      - disks:/disks
    tmpfs: [/run/storage]

volumes:
  postgres-data:
  registry-data:
  metrics-data:
  logs-data:
  ovn:
  ovs:
  disks:
