name: observatory-hub

x-observatory: &observatory
  image: ghcr.io/asterism-dev/observatory:${OBSERVATORY_VERSION:-latest}
  build:
    context: ..
    dockerfile: deploy/observatory.Dockerfile
  restart: unless-stopped
  # Covers the 10s drain of in-flight requests before Docker kills the process.
  stop_grace_period: 20s

services:
  # Public entry point: serves the web app and forwards to the hub, never to /internal/*.
  edge:
    <<: *observatory
    command: ["edge"]
    environment:
      OBSERVATORY_EDGE_TOKEN: ${OBSERVATORY_EDGE_TOKEN:?set OBSERVATORY_EDGE_TOKEN in deploy/.env}
      OBSERVATORY_EDGE_HUB_URL: http://hub:8091
    ports:
      - "${OBSERVATORY_HTTP_PORT:-8090}:8090"
    depends_on:
      hub:
        condition: service_started
  # Listens on 8091 inside the compose network only: the edge and the internal callers (registry, gateway, storage) reach it there.
  hub:
    <<: *observatory
    command: ["hub"]
    env_file: .env
    # Repeats the required values from .env so a missing one stops `up` instead of leaving the hub in a restart loop.
    environment:
      OBSERVATORY_DATABASE_URL: postgres://observatory:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/observatory?sslmode=disable
      OBSERVATORY_PUBLIC_URL: ${OBSERVATORY_PUBLIC_URL:?set OBSERVATORY_PUBLIC_URL in deploy/.env}
      OBSERVATORY_OIDC_ISSUER: ${OBSERVATORY_OIDC_ISSUER:?set OBSERVATORY_OIDC_ISSUER in deploy/.env}
      OBSERVATORY_OIDC_WEB_CLIENT_ID: ${OBSERVATORY_OIDC_WEB_CLIENT_ID:?set OBSERVATORY_OIDC_WEB_CLIENT_ID in deploy/.env}
      OBSERVATORY_OIDC_CLI_CLIENT_ID: ${OBSERVATORY_OIDC_CLI_CLIENT_ID:?set OBSERVATORY_OIDC_CLI_CLIENT_ID in deploy/.env}
      OBSERVATORY_SECRETS_KEY: ${OBSERVATORY_SECRETS_KEY:?set OBSERVATORY_SECRETS_KEY in deploy/.env}
      OBSERVATORY_EDGE_TOKEN: ${OBSERVATORY_EDGE_TOKEN:?set OBSERVATORY_EDGE_TOKEN in deploy/.env}
      OBSERVATORY_REGISTRY_URL: http://registry:5000
      OBSERVATORY_REGISTRY_KEY_DIR: /keys
      OBSERVATORY_REGISTRY_CERT_DIR: /certs
      OBSERVATORY_REGISTRY_EVENTS_SECRET: ${OBSERVATORY_REGISTRY_EVENTS_SECRET:?set OBSERVATORY_REGISTRY_EVENTS_SECRET in deploy/.env}
      OBSERVATORY_REGISTRY_CONFIG: /etc/distribution/config.yml
      OBSERVATORY_METRICS_URL: http://victoriametrics:8428
      OBSERVATORY_LOGS_URL: http://victorialogs:9428
    volumes:
      - registry-keys:/keys
      - registry-certs:/certs
      - ./registry/config.yml:/etc/distribution/config.yml:ro
      - registry-data:/var/lib/registry
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: observatory
      POSTGRES_DB: observatory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observatory"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
  # Reached only through the hub's /v2/ proxy; restarts until the hub has written its token certificate.
  registry:
    image: registry:3.0.0@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e
    restart: unless-stopped
    # The hub's user, so the hub's garbage collection can delete what the registry wrote.
    user: "65532:65532"
    depends_on:
      hub:
        condition: service_started
      registry-data-owner:
        condition: service_completed_successfully
    environment:
      OTEL_TRACES_EXPORTER: none
      REGISTRY_AUTH_TOKEN_REALM: ${OBSERVATORY_PUBLIC_URL:?set OBSERVATORY_PUBLIC_URL in deploy/.env}/v2/token
      REGISTRY_NOTIFICATIONS_ENDPOINTS: |
        - name: hub
          url: http://hub:8091/internal/registry/events
          headers: {Authorization: ["Bearer ${OBSERVATORY_REGISTRY_EVENTS_SECRET:?set OBSERVATORY_REGISTRY_EVENTS_SECRET in deploy/.env}"]}
          timeout: 10s
          threshold: 3
          backoff: 10s
          ignore: {actions: [pull]}
    volumes:
      - ./registry/config.yml:/etc/distribution/config.yml:ro
      - registry-data:/var/lib/registry
      - registry-certs:/keys:ro
  # Hands registry data written by root before the registry ran as the hub's user over to that user, once.
  registry-data-owner:
    image: registry:3.0.0@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e
    restart: "no"
    entrypoint: ["sh", "-c", '[ "$$(stat -c %u /var/lib/registry)" = 65532 ] || chown -R 65532:65532 /var/lib/registry']
    volumes:
      - registry-data:/var/lib/registry
  # Reached only by the hub, which stamps and forwards node telemetry.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.156.0@sha256:da8a90ac0912f16589be2b96a6441a2fca4bca415c83783d972d92e3b5b66970
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${OBSERVATORY_METRICS_RETENTION:-30d}
      - -opentelemetry.usePrometheusNaming
      - -opentelemetry.promoteScopeMetadata=false
      - -storage.maxHourlySeries=${OBSERVATORY_METRICS_MAX_HOURLY_SERIES:-500000}
      - -storage.maxDailySeries=${OBSERVATORY_METRICS_MAX_DAILY_SERIES:-2000000}
    volumes:
      - metrics-data:/storage
  victorialogs:
    image: victoriametrics/victoria-logs:v1.54.0@sha256:ee4e820cac3721f5f5d91641b950c22439593adc4224f9655e5333d5a84c1dfe
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${OBSERVATORY_LOGS_RETENTION:-14d}
      - -search.maxQueryDuration=60s
    volumes:
      - logs-data:/storage
  # Loads the kernel modules the gateway needs; built-in modules make modprobe fail harmlessly.
  modules:
    image: alpine:3.22
    privileged: true
    volumes:
      - /lib/modules:/lib/modules:ro
    command: ["sh", "-c", "modprobe -a openvswitch wireguard xt_connlimit || true"]
  # Owns the network namespace of gateway and storage, so a gateway crash or kill leaves storage's namespace in place.
  netns:
    image: alpine:3.22
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    read_only: true
    command: ["sleep", "infinity"]
    sysctls:
      net.ipv4.ip_forward: "1"
    ports:
      - "51820:51820/udp"
      - "51821:51821/udp"
  gateway:
    image: ghcr.io/asterism-dev/observatory-gateway:${OBSERVATORY_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/gateway.Dockerfile
    restart: unless-stopped
    network_mode: service:netns
    depends_on:
      netns:
        condition: service_started
        restart: true
      modules:
        condition: service_completed_successfully
      hub:
        condition: service_started
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    environment:
      HUB_URL: http://hub:8091
      OBSERVATORY_GATEWAY_TOKEN: ${OBSERVATORY_GATEWAY_TOKEN:?set OBSERVATORY_GATEWAY_TOKEN in deploy/.env}
      OBSERVATORY_GATEWAY_DNS: ${OBSERVATORY_GATEWAY_DNS:-}
    volumes:
      - ovn:/var/lib/ovn
      - ovs:/etc/openvswitch
      # the host's upstream resolvers (docs/network.md, "Upstream DNS"); a directory, as resolved replaces the file
      - /run/systemd/resolve:/host/resolve:ro
      - /etc/resolv.conf:/host/resolv.conf:ro
  # In the netns service's namespace, with the gateway, so exports listen on the underlay address only, nothing published on the host.
  storage:
    image: ghcr.io/asterism-dev/observatory-storage:${OBSERVATORY_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/storage.Dockerfile
    restart: unless-stopped
    network_mode: service:netns
    depends_on:
      netns:
        condition: service_started
        restart: true
      gateway:
        condition: service_started
    environment:
      HUB_URL: http://hub:8091
      OBSERVATORY_STORAGE_TOKEN: ${OBSERVATORY_STORAGE_TOKEN:?set OBSERVATORY_STORAGE_TOKEN in deploy/.env}
    volumes:
      - disks:/disks
    tmpfs: [/run/storage]
  caddy:
    image: caddy:2.11.9
    profiles: [tls]
    restart: unless-stopped
    depends_on: [edge]
    environment:
      OBSERVATORY_DOMAIN: ${OBSERVATORY_DOMAIN:-}
      OBSERVATORY_TLS: ${OBSERVATORY_TLS:-acme}
    # An empty domain would reach Caddy as a cryptic Caddyfile error.
    command: ["sh", "-c", "[ -n \"$$OBSERVATORY_DOMAIN\" ] || { echo 'set OBSERVATORY_DOMAIN in deploy/.env for the tls profile' >&2; exit 1; }; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  registry-data:
  registry-keys:
  registry-certs:
  metrics-data:
  logs-data:
  ovn:
  ovs:
  disks:
  caddy-data:
  caddy-config:
