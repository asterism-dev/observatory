name: ci

on:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_USER: observatory
          POSTGRES_PASSWORD: observatory
          POSTGRES_DB: observatory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U observatory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OBSERVATORY_TEST_DATABASE_URL: postgres://observatory:observatory@localhost:5432/observatory?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: go vet ./...
      - run: go test ./...
      - run: node --test web/src/composables/*.test.ts
      - run: make web
      # A hub built without the GUI would serve an empty page.
      - run: test -n "$(ls web/dist/assets)"
      - run: go build ./...
