syntax = "proto3";

package observatory.iam.v1;

import "google/protobuf/timestamp.proto";

// IAMInternalService answers services' identity lookups; callers authenticate with a service token.
service IAMInternalService {
  // GetUsers returns the known users among user_ids, at most 1000 per call.
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
  // ListSSHKeys returns the SSH public keys of user_ids, at most 1000 per call.
  rpc ListSSHKeys(ListSSHKeysRequest) returns (ListSSHKeysResponse);
  rpc ListTeams(ListTeamsRequest) returns (ListTeamsResponse);
  // GetMembership reports whether user_id is a member of org_id, and with which built-in role.
  rpc GetMembership(GetMembershipRequest) returns (GetMembershipResponse);
  // GetSession returns a session whether or not it ended; NotFound if it never existed.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
}

message GetUsersRequest {
  repeated string user_ids = 1;
}

message GetUsersResponse {
  repeated User users = 1;
}

message User {
  string id = 1;
  string name = 2;
  string email = 3;
}

message ListSSHKeysRequest {
  repeated string user_ids = 1;
}

message ListSSHKeysResponse {
  repeated SSHKey keys = 1;
}

message SSHKey {
  string user_id = 1;
  string public_key = 2;
}

message ListTeamsRequest {
  string org_id = 1;
}

message ListTeamsResponse {
  repeated Team teams = 1;
}

message Team {
  string id = 1;
  string name = 2;
}

message GetMembershipRequest {
  string org_id = 1;
  string user_id = 2;
}

message GetMembershipResponse {
  bool member = 1;
  string role = 2;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  string user_id = 1;
  google.protobuf.Timestamp expires_at = 2;
  bool revoked = 3;
}
