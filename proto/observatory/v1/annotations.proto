syntax = "proto3";

package observatory.v1;

import "google/protobuf/descriptor.proto";

enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_WRITE = 1;
  KIND_READ = 2;
}

message Permission {
  string name = 1;
  string object = 2;
  Kind kind = 3;
}

extend google.protobuf.MethodOptions {
  Permission permission = 50001;
}
