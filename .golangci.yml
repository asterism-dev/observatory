version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - govet
    - staticcheck
  settings:
    staticcheck:
      # golangci-lint's defaults minus QF1001: negated conditions are written as they read.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1001"]
    errcheck:
      exclude-functions:
        - (net.Listener).Close
        - (net.Conn).Close
        - (*os.File).Close
        - (io.ReadCloser).Close
        - (*net/http.Server).Close
        - (*github.com/coder/websocket.Conn).CloseNow
        - io.WriteString
    depguard:
      rules:
        edge:
          files: ["**/internal/edge/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/asterism-dev/observatory/internal/edge
            - github.com/asterism-dev/observatory/internal/platform
            - github.com/asterism-dev/observatory/gen
            - github.com/asterism-dev/observatory/web
            - github.com/coder/websocket
        hubserver:
          # Tests may import the edge: the identity end-to-end test runs the real edge in front of iam.
          files: ["**/internal/hubserver/**", "!$test"]
          deny:
            - pkg: github.com/asterism-dev/observatory/internal/edge
              desc: the hub must not depend on the edge; shared code belongs in internal/platform
        iam:
          files: ["**/internal/iam/**", "!$test", "!**/internal/iam/store/storetest/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/asterism-dev/observatory/internal/iam
            - github.com/asterism-dev/observatory/internal/authz
            - github.com/asterism-dev/observatory/internal/seal
            - github.com/asterism-dev/observatory/internal/platform
            - github.com/asterism-dev/observatory/gen
            - connectrpc.com/connect
            - connectrpc.com/vanguard
            - google.golang.org/protobuf
            - github.com/google/uuid
            - github.com/jackc/pgx/v5
            - github.com/coreos/go-oidc/v3
            - golang.org/x/oauth2
            - golang.org/x/crypto/ssh
        iam-test:
          # Tests may also build a throwaway database and check the hub's migrations leave iam's tables alone.
          files: ["**/internal/iam/**/*_test.go", "**/internal/iam/store/storetest/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/asterism-dev/observatory/internal/iam
            - github.com/asterism-dev/observatory/internal/authz
            - github.com/asterism-dev/observatory/internal/seal
            - github.com/asterism-dev/observatory/internal/platform
            - github.com/asterism-dev/observatory/internal/db
            - github.com/asterism-dev/observatory/gen
            - connectrpc.com/connect
            - google.golang.org/protobuf
            - github.com/golang-jwt/jwt/v5
            - github.com/google/uuid
            - github.com/jackc/pgx/v5
            - golang.org/x/crypto/ssh
        hub-not-iam:
          # hubserver embeds iam until iam runs as its own process.
          files:
            - "**/internal/api/**"
            - "**/internal/auth/**"
            - "**/internal/integrations/**"
            - "**/internal/egress/**"
            - "**/internal/telemetry/**"
            - "**/internal/store/**"
            - "**/internal/fleet/**"
            - "**/internal/network/**"
            - "**/internal/builds/**"
            - "**/internal/disks/**"
            - "**/internal/images/**"
            - "**/internal/registry/**"
          deny:
            - pkg: github.com/asterism-dev/observatory/internal/iam
              desc: the hub reaches iam only over its internal API and policy stream
        audit:
          files: ["**/internal/audit/**", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/asterism-dev/observatory/internal/audit
            - github.com/asterism-dev/observatory/internal/platform
            - github.com/asterism-dev/observatory/gen
            - connectrpc.com/connect
            - google.golang.org/protobuf
            - github.com/google/uuid
            - github.com/jackc/pgx/v5
            - github.com/nats-io/nats.go
        platform-test:
          files: ["**/internal/platform/**/*_test.go"]
          list-mode: strict
          allow:
            - github.com/asterism-dev/observatory/internal/db/dbtest
            - $gostd
            - github.com/asterism-dev/observatory/internal/platform
            - github.com/asterism-dev/observatory/gen
            - github.com/asterism-dev/observatory/internal/authz
            - connectrpc.com/connect
            - connectrpc.com/vanguard
            - google.golang.org/protobuf
            - github.com/golang-jwt/jwt/v5
            - github.com/google/uuid
            - github.com/jackc/pgx/v5
            - github.com/pressly/goose/v3
            - github.com/nats-io/nats.go
            - github.com/nats-io/nats-server/v2
        platform:
          files: ["**/internal/platform/**", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/asterism-dev/observatory/internal/platform
            - github.com/asterism-dev/observatory/gen
            - github.com/asterism-dev/observatory/internal/authz
            - connectrpc.com/connect
            - google.golang.org/protobuf
            - github.com/golang-jwt/jwt/v5
            - github.com/google/uuid
            - github.com/jackc/pgx/v5
            - github.com/pressly/goose/v3
            - github.com/nats-io/nats.go
            - github.com/nats-io/nats-server/v2
          deny:
            - pkg: github.com/asterism-dev/observatory/internal/api
              desc: platform code must not import a service
            - pkg: github.com/asterism-dev/observatory/internal/store
              desc: platform code must not import a service
            - pkg: github.com/asterism-dev/observatory/internal/fleet
              desc: platform code must not import a service
            - pkg: github.com/asterism-dev/observatory/internal/network
              desc: platform code must not import a service
            - pkg: github.com/asterism-dev/observatory/internal/db
              desc: platform code must not import a service
            - pkg: github.com/asterism-dev/observatory/internal/auth
              desc: platform code must not import a service
            - pkg: github.com/asterism-dev/observatory/internal/registry
              desc: platform code must not import a service
            - pkg: github.com/asterism-dev/observatory/internal/hubserver
              desc: platform code must not import a service
            - pkg: github.com/asterism-dev/observatory/internal/edge
              desc: platform code must not import a service
  exclusions:
    rules:
      # ponytail: errcheck covers only the packages added with the edge; the older tree has ~700 findings to fix first.
      - path-except: ^(internal/(audit|edge|hubserver|platform)/|cmd/observatory/serve)
        linters: [errcheck]
