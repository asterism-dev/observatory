version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - govet
    - staticcheck
  settings:
    staticcheck:
      # golangci-lint's defaults minus QF1001: negated conditions are written as they read.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1001"]
    errcheck:
      exclude-functions:
        - (net.Listener).Close
        - (net.Conn).Close
        - (*os.File).Close
        - (io.ReadCloser).Close
        - (*net/http.Server).Close
        - (*github.com/coder/websocket.Conn).CloseNow
        - io.WriteString
    depguard:
      rules:
        edge:
          files: ["**/internal/edge/**"]
          deny:
            - pkg: github.com/asterism-dev/observatory/internal/hubserver
              desc: the edge talks to the hub over HTTP only
            - pkg: github.com/asterism-dev/observatory/internal/api
              desc: hub package
            - pkg: github.com/asterism-dev/observatory/internal/store
              desc: hub package
            - pkg: github.com/asterism-dev/observatory/internal/fleet
              desc: hub package
            - pkg: github.com/asterism-dev/observatory/internal/network
              desc: hub package
        hubserver:
          files: ["**/internal/hubserver/**"]
          deny:
            - pkg: github.com/asterism-dev/observatory/internal/edge
              desc: the hub must not depend on the edge; shared code belongs in internal/platform
        platform:
          files: ["**/internal/platform/**"]
          deny:
            - pkg: github.com/asterism-dev/observatory/internal/edge
              desc: platform code must not import a service
            - pkg: github.com/asterism-dev/observatory/internal/hubserver
              desc: platform code must not import a service
  exclusions:
    rules:
      # ponytail: errcheck covers only the packages added with the edge; the older tree has ~700 findings to fix first.
      - path-except: ^(internal/(edge|hubserver|platform)/|cmd/observatory/serve)
        linters: [errcheck]
